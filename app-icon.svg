<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- 日曆卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="116" y="120" width="280" height="300" rx="36" fill="#ffffff"/>
  </g>

  <!-- 日曆環 -->
  <rect x="176" y="84" width="20" height="72" rx="10" fill="#3730a3"/>
  <rect x="316" y="84" width="20" height="72" rx="10" fill="#3730a3"/>

  <!-- 日報條列 -->
  <rect x="164" y="196" width="140" height="22" rx="11" fill="#a5b4fc"/>
  <rect x="164" y="244" width="184" height="22" rx="11" fill="#a5b4fc"/>
  <rect x="164" y="292" width="110" height="22" rx="11" fill="#a5b4fc"/>

  <!-- 完成勾勾徽章 -->
  <circle cx="356" cy="356" r="68" fill="#10b981" stroke="#ffffff" stroke-width="14"/>
  <path d="M 326 358 L 348 380 L 390 332" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
