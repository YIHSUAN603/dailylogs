# CI 驗證：push / PR 到 develop、main → 前端 build/lint/test + Rust fmt/clippy/test
# （tag 不觸發，Release 見 release.yml）

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  frontend:
    name: 前端驗證（tsc + vite + ESLint + Vitest）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: tsc 型別檢查 + vite build
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test:run

  rust:
    name: Rust 驗證（fmt + clippy + test）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 安裝 Tauri Linux 系統依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! 編譯期要求 frontendDist（../dist）目錄存在
      - name: 建立空 dist 目錄
        run: mkdir -p dist

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all
