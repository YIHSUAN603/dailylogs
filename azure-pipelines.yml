# Tauri 2 桌面 app CI/CD — 自架 Windows agent
# CI:      push / PR 到 develop、main → 型別檢查 + build + lint + 測試
# Release: 推 tag v* 時 → 原生 MSVC 編譯產出 Windows NSIS 安裝檔（artifact）

trigger:
  branches:
    include:
      - "*"
  tags:
    include:
      - "v*"

pr:
  branches:
    include:
      - main

variables:
  CI: "true"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

stages:
  # ============================================================
  # CI Stage：分支 push / PR 觸發（tag 不跑 CI，避免與 Release 重複）
  # ============================================================
  - stage: CI
    displayName: "CI - 驗證"
    condition: not(startsWith(variables['Build.SourceBranch'], 'refs/tags/'))
    jobs:
      - job: verify
        displayName: "前端 + Rust 驗證"
        timeoutInMinutes: 60
        pool:
          name: "REPLACE_WITH_YOUR_POOL" # ← 改成你的 self-hosted pool 名稱
          demands:
            - Agent.OS -equals Windows_NT
            - node # agent 自訂 capability（見 README / 計畫）
            - rust # agent 自訂 capability
        steps:
          - checkout: self
            fetchDepth: 1

          # 註：Pipeline 快取（Cache@2）僅雲端 Azure DevOps Services 支援，
          #     地端 Server 版會報 TF400734；self-hosted agent 的 work 目錄與
          #     %USERPROFILE%\.cargo 本來就持久化，毋須快取任務。

          # ---------- 前端 ----------
          - script: npm ci
            displayName: "npm ci (frozen lockfile)"

          - script: npm run build
            displayName: "tsc 型別檢查 + vite build"

          - script: npm run lint
            displayName: "ESLint"

          - script: npm run test:run
            displayName: "Vitest"

          # ---------- Rust ----------
          - script: cargo fmt --all -- --check
            displayName: "cargo fmt --check"
            workingDirectory: src-tauri

          - script: cargo clippy --all-targets --all-features -- -D warnings
            displayName: "cargo clippy -D warnings"
            workingDirectory: src-tauri

          - script: cargo test --all
            displayName: "cargo test"
            workingDirectory: src-tauri

  # ============================================================
  # Release Stage：tag v* 觸發，原生 MSVC 產 NSIS 安裝檔
  # ============================================================
  - stage: Release
    displayName: "Release - Windows NSIS"
    condition: startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
    jobs:
      - job: build_windows
        displayName: "打包 Windows 安裝檔"
        timeoutInMinutes: 120
        pool:
          name: "REPLACE_WITH_YOUR_POOL" # ← 同上
          demands:
            - Agent.OS -equals Windows_NT
            - node
            - rust
        steps:
          - checkout: self
            fetchDepth: 1

          # ---------- 版本一致性檢查（fail fast）----------
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $tag = "$(Build.SourceBranchName)"        # e.g. v0.1.0
              $tagVer = $tag -replace '^v',''           # 0.1.0
              $conf = Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json
              $confVer = $conf.version
              $cargoVer = (Select-String -Path 'src-tauri/Cargo.toml' `
                            -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
              Write-Host "tag=$tagVer  tauri.conf=$confVer  Cargo.toml=$cargoVer"
              if ($tagVer -ne $confVer -or $tagVer -ne $cargoVer) {
                Write-Error "版本不一致：tag=$tagVer, tauri.conf.json=$confVer, Cargo.toml=$cargoVer"
                exit 1
              }
            displayName: "檢查 tag == tauri.conf == Cargo.toml 版本"

          # 註：Cache@2 僅雲端支援，地端 Server 版會報 TF400734（見 CI stage 說明）

          - script: npm ci
            displayName: "npm ci"

          # tauri build 會自動跑 beforeBuildCommand (npm run build)，不必另外手動 build 前端
          - script: npm run tauri build -- --bundles nsis
            displayName: "tauri build (NSIS, MSVC native)"

          # ---------- 發佈 artifact（用目錄，避免中文/空白檔名問題）----------
          # 註：PublishPipelineArtifact@1（管線成品）地端 Server 版不支援，
          #     會報「內部部署不支援管線成品工作」；改用 PublishBuildArtifacts@1
          #     （組建成品，publishLocation: Container 存在 Server 上）。
          - task: PublishBuildArtifacts@1
            displayName: "發佈 NSIS 安裝檔"
            inputs:
              PathtoPublish: "src-tauri/target/release/bundle/nsis"
              ArtifactName: "nsis-installer"
              publishLocation: "Container"

          - task: PublishBuildArtifacts@1
            displayName: "發佈獨立 exe"
            inputs:
              PathtoPublish: "src-tauri/target/release/dailylogs.exe"
              ArtifactName: "standalone-exe"
              publishLocation: "Container"

          # ---------- 上傳到 Google Drive（個人 OAuth，rclone）----------
          # 前置：本機 rclone config 產生含 OAuth token 的設定，遠端命名 gdrive，
          #       上傳成 Pipelines → Library → Secure files，檔名 rclone.conf
          - task: DownloadSecureFile@1
            name: rcloneConf
            displayName: "取得 rclone 設定（含 OAuth token）"
            inputs:
              secureFile: "rclone.conf"

          - powershell: |
              $ErrorActionPreference = 'Stop'
              # 確保 rclone 存在（agent 第一次跑會自動下載免安裝版）
              $rclone = "$env:AGENT_TEMPDIRECTORY\rclone\rclone.exe"
              if (-not (Test-Path $rclone)) {
                $zip = "$env:AGENT_TEMPDIRECTORY\rclone.zip"
                Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile $zip
                Expand-Archive $zip "$env:AGENT_TEMPDIRECTORY\rclone-x" -Force
                New-Item -ItemType Directory -Force "$env:AGENT_TEMPDIRECTORY\rclone" | Out-Null
                Copy-Item (Get-ChildItem "$env:AGENT_TEMPDIRECTORY\rclone-x" -Recurse -Filter rclone.exe)[0].FullName $rclone
              }
              $conf = "$(rcloneConf.secureFilePath)"
              # 命名沿用雲端慣例：tools/dailylogs/dailylogs_<版號>（tag v1.2.0 → dailylogs_v1.2.0）
              $dest = "gdrive:tools/dailylogs/dailylogs_$(Build.SourceBranchName)"
              # 只傳安裝檔與獨立 exe，不傳整包 target（避免帶上 .pdb / deps / 快取雜物）
              & $rclone --config $conf copy "src-tauri/target/release/bundle/nsis" "$dest" -v
              & $rclone --config $conf copy "src-tauri/target/release/dailylogs.exe" "$dest" -v
            displayName: "上傳安裝檔到 Google Drive (tools/dailylogs/dailylogs_<版號>)"
